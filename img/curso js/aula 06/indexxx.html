 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        body{
            background-color: aquamarine;
            color: rgb(225, 34, 34);
            font: normal, 16px, arial;
        }
    </style>
</head>
<body>
    <H1>Óla, Mundo</H1>
    <p>Já me livrei</p>
    <script>
     var n1 = Number.parseFloat(window.prompt('Digite um número;'))//Pode se usar somente "Number"
     var n2 = Number.parseFloat(window.prompt('Digite outro número;'))
     var s = n1 + n2
     window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`)//Concatenação
     // (Number + Number) para adição
     // (string + string) para concatenação


         
    </script>
</body>
